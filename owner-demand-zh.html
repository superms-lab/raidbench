<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>RaidBench 多游戏需求池</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <style>
      :root{color-scheme:light;--ink:#17212a;--muted:#62707c;--line:#d9e0e4;--surface:#fff;--canvas:#f3f5f6;--green:#16794b;--blue:#23659a;--gold:#9b6509;--red:#a73b32}
      *{box-sizing:border-box}body{margin:0;min-width:320px;background:var(--canvas);color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;letter-spacing:0}button,a{font:inherit}.topbar{display:flex;min-height:64px;align-items:center;justify-content:space-between;gap:18px;padding:0 28px;border-bottom:1px solid var(--line);background:var(--surface)}.brand{font-size:17px;font-weight:760}.nav{display:flex;gap:18px}.nav a{color:var(--muted);font-size:13px;text-decoration:none}.nav a:last-child{color:var(--ink);font-weight:700}main{width:min(1120px,calc(100% - 40px));margin:0 auto;padding:30px 0 54px}.heading{display:flex;align-items:end;justify-content:space-between;gap:24px}h1{margin:0;font-size:28px}.subtitle,.sync{color:var(--muted);font-size:13px}.subtitle{margin:8px 0 0}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:24px}.metric{min-height:100px;padding:17px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}.metric span{color:var(--muted);font-size:12px}.metric strong{display:block;margin-top:12px;font-size:25px}.metric:nth-child(1) strong{color:var(--blue)}.metric:nth-child(2) strong{color:var(--green)}.metric:nth-child(3) strong{color:var(--gold)}.metric:nth-child(4) strong{color:var(--red)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:30px;padding-top:24px;border-top:1px solid var(--line)}h2{margin:0;font-size:18px}.reload{min-height:36px;padding:0 13px;border:1px solid #b9c4cb;border-radius:6px;background:#fff;color:var(--ink);cursor:pointer}.table-wrap{overflow:auto;margin-top:15px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}table{width:100%;border-collapse:collapse;min-width:860px}th,td{padding:13px 14px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{background:#f8fafb;color:var(--muted);font-size:11px;text-transform:uppercase}tbody tr:last-child td{border-bottom:0}.score{font-weight:800;color:var(--gold)}.health-ok{color:var(--green);font-weight:700}.demand-list{display:grid;gap:12px;margin-top:15px}.demand{display:grid;grid-template-columns:120px minmax(0,1fr) 72px;gap:18px;padding:18px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}.demand-meta{color:var(--muted);font-size:12px;line-height:1.6}.demand h3{margin:0;font-size:16px;line-height:1.4}.demand p{margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.6}.demand a{display:inline-block;margin-top:9px;color:var(--blue);font-size:12px;text-decoration:none}.demand-score{text-align:right;font-size:22px;font-weight:800;color:var(--gold)}.empty{margin-top:15px;padding:26px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--muted)}
      @media(max-width:760px){.topbar{padding:0 16px}.nav{gap:11px}.nav a{font-size:12px}main{width:calc(100% - 24px);padding-top:22px}.heading{display:block}.sync{margin-top:10px}.metrics{grid-template-columns:1fr 1fr}.demand{grid-template-columns:1fr}.demand-score{text-align:left}}
    </style>
  </head>
  <body>
    <header class="topbar"><div class="brand">RaidBench <span class="subtitle">经营后台</span></div><nav class="nav"><a href="./owner-traffic-zh.html">流量</a><a href="./owner-acquisition-zh.html">获客</a><a href="./owner-demand-zh.html">需求</a><a href="./owner-products-zh.html">产品准入</a><a href="./owner-costs-zh.html">成本</a></nav></header>
    <main>
      <div class="heading"><div><h1>多游戏需求池</h1><p class="subtitle">官方来源负责事实，社区问题只负责判断玩家正在寻找什么。</p></div><div class="sync" id="sync">正在读取服务器数据</div></div>
      <section class="metrics"><article class="metric"><span>注册游戏</span><strong id="games">--</strong></article><article class="metric"><span>注册来源</span><strong id="sources">--</strong></article><article class="metric"><span>私有待办</span><strong id="backlog">--</strong></article><article class="metric"><span>Reddit API 来源</span><strong id="reddit-api">--</strong></article></section>
      <div class="section-head"><h2>各游戏采集状态</h2><button class="reload" id="reload" type="button">刷新</button></div>
      <div class="table-wrap"><table><thead><tr><th>游戏</th><th>来源</th><th>直接监控</th><th>待办</th><th>新需求</th><th>最高分</th><th>最近成功</th></tr></thead><tbody id="game-rows"></tbody></table></div>
      <div class="section-head"><h2>高价值需求</h2><span class="subtitle">这里只展示候选，不会自动发布</span></div>
      <section class="demand-list" id="demand-list"></section>
    </main>
    <script>
      const escapeHtml=value=>String(value??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
      const formatDate=value=>value?new Date(value).toLocaleString("zh-CN",{dateStyle:"short",timeStyle:"short"}):"--";
      function render(payload){const summary=payload.summary||{};document.querySelector("#games").textContent=summary.games??0;document.querySelector("#sources").textContent=summary.registeredSources??0;document.querySelector("#backlog").textContent=summary.backlogTotal??0;document.querySelector("#reddit-api").textContent=summary.activeRedditApiSources??0;document.querySelector("#sync").textContent=`服务器同步：${formatDate(payload.generatedAt)}`;document.querySelector("#game-rows").innerHTML=(payload.perGame||[]).map(item=>`<tr><td><strong>${escapeHtml(item.game)}</strong></td><td>${item.registeredSources}</td><td>${item.directSources}</td><td>${item.backlogTotal}</td><td>${item.newDemand}</td><td class="score">${item.topScore??"--"}</td><td class="health-ok">${escapeHtml(formatDate(item.lastSourceSuccess))}</td></tr>`).join("");const list=document.querySelector("#demand-list");const demand=payload.topDemand||[];list.innerHTML=demand.length?demand.map(item=>`<article class="demand"><div class="demand-meta"><strong>${escapeHtml(item.game)}</strong><br>${escapeHtml(item.topic)}<br>${item.patchSensitive?"版本敏感":"相对稳定"}</div><div><h3>${escapeHtml(item.title)}</h3><p>${escapeHtml(item.intentZh||"官方来源发生变化，等待内容判断。")}</p><a href="${escapeHtml(item.url)}" target="_blank" rel="noopener">查看原始来源</a></div><div class="demand-score">${item.score}</div></article>`).join(""):'<div class="empty">还没有通过校验的社区需求。</div>';}
      async function load(){document.querySelector("#sync").textContent="正在读取服务器数据";const response=await fetch("/api/owner/demand",{cache:"no-store"});if(!response.ok)throw new Error("服务器需求数据读取失败");render(await response.json());}
      document.querySelector("#reload").addEventListener("click",()=>load().catch(error=>document.querySelector("#sync").textContent=error.message));load().catch(error=>document.querySelector("#sync").textContent=error.message);
    </script>
  </body>
</html>
