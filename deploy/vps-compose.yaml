name: raidbench-platform

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  raidbench:
    build:
      context: /opt/raidbench/app
      dockerfile: Dockerfile
    image: local/raidbench-runtime:2026-09-04-phase8-palworld-live-v11
    container_name: raidbench-app
    restart: unless-stopped
    env_file:
      - path: /opt/raidbench/secrets/runtime.env
        format: raw
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /opt/raidbench/data:/data
      - /opt/raidbench/jobs:/jobs
    group_add:
      - "987"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  raidbench-sandbox:
    profiles: ["sandbox"]
    build:
      context: /opt/raidbench/app
      dockerfile: Dockerfile
    image: local/raidbench-runtime:2026-09-04-phase8-palworld-live-v11
    container_name: raidbench-sandbox
    restart: unless-stopped
    env_file:
      - path: /opt/raidbench/secrets/paypal-sandbox.env
        format: raw
    environment:
      RAIDBENCH_MODE: production
      RAIDBENCH_HOST: 0.0.0.0
      RAIDBENCH_PORT: 8080
      RAIDBENCH_DB_PATH: /data/raidbench-sandbox.db
      RAIDBENCH_RAID_DATA_PATH: /data/rust-raid-data.json
      RAIDBENCH_CHECKOUT_ENABLED: "1"
      PUBLIC_BASE_URL: http://localhost:18081
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - /opt/raidbench/sandbox-data:/data
      - /opt/raidbench/jobs:/jobs
    group_add:
      - "987"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
